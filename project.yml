name: StudioApp
options: {bundleIdPrefix: com.menhar, deploymentTarget: {iOS: "15.0"}}
targets:
  StudioApp:
    type: application
    platform: iOS
    sources: [Sources, {path: Resources, type: folder}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.menhar.studio3d
        PRODUCT_NAME: 3DStudio
        PRODUCT_MODULE_NAME: StudioApp
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Info.plist
      properties:
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleDisplayName: 3D Studio
        CFBundlePackageType: APPL
        CFBundleDevelopmentRegion: en
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
