name: Build unsigned IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle Three.js for offline use
        run: |
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o Resources/www/three.min.js
          sed -i '' 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' Resources/www/index.html
          grep -q 'src="three.min.js"' Resources/www/index.html

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          ls

      - name: Archive without signing
        run: |
          xcodebuild archive \
            -project StudioApp.xcodeproj \
            -scheme StudioApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP=$(find build/App.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr 3DStudio-Unsigned.ipa Payload
