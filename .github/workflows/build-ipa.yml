name: Build unsigned IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle Three.js for offline use
        run: |
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o Resources/www/three.min.js
          sed -i '' 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' Resources/www/index.html
          grep -q 'src="three.min.js"' Resources/www/index.html

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          cat Info.plist

      - name: Build without signing
        run: |
          set -o pipefail
          xcodebuild build \
            -project StudioApp.xcodeproj \
            -scheme StudioApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build.log | tail -n 40

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -name "*.app" -maxdepth 2 | head -n 1)
          echo "Found app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          plutil -p Payload/*.app/Info.plist | head -20
          zip -qr 3DStudio-Unsigned.ipa Payload
          unzip -l 3DStudio-Unsigned.ipa | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: 3DStudio-Unsigned-IPA
          path: 3DStudio-Unsigned.ipa
